# Builds and publishes a release executable whenever a version tag is pushed.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# This workflow only runs on GitHub Actions. The file is inert on the
# self-hosted git server (plain git over SSH — no CI there, no hooks installed).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download and pin immich-go
        shell: pwsh
        run: ./build.ps1

      - name: Publish single-file executable
        shell: pwsh
        run: >
          dotnet publish src/ImmichAutoUploader.App/ImmichAutoUploader.App.csproj
          -c Release -r win-x64 --self-contained true -o publish

      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish/* -DestinationPath "ImmichAutoUploader-$tag-win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) {
            "iscc"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            throw "ISCC compiler not found."
          }
          & $iscc /DAppVersion="$tag" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ImmichAutoUploader-*-win-x64.zip
            ImmichAutoUploader-*-Setup.exe
          generate_release_notes: true
